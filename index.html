<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartons Pétanque</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mu:#66707c;--bd:#d9dde3;--ac:#1f5fbf;--y:#f5c400;--o:#f57c00;--r:#d32f2f}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1e2329;--tx:#eceff3;--mu:#98a2ae;--bd:#333b45;--ac:#6ea3f0}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1e2329;--tx:#eceff3;--mu:#98a2ae;--bd:#333b45;--ac:#6ea3f0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5}
header h1{font-size:18px;margin:0;flex:1;min-width:150px}
header small{display:block;color:var(--mu);font-weight:400;font-size:13px}
nav{display:flex;gap:6px;padding:10px 14px;overflow-x:auto}
nav button{flex:1;white-space:nowrap}
main{padding:0 14px 40px;max-width:900px;margin:0 auto}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 14px;cursor:pointer}
button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button.dan{color:var(--r);border-color:var(--r)}
button:disabled{opacity:.45}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.tm{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd);cursor:pointer}
.tm:first-child{border-top:0}
.tm b{font-size:17px}
.mu{color:var(--mu);font-size:13px}
.dot{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:11px;font-size:12px;font-weight:700;color:#000;margin-left:3px;padding:0 5px}
.dY{background:var(--y)}.dO{background:var(--o)}.dR{background:var(--r);color:#fff}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cols button{height:64px;font-weight:700;font-size:16px;border:3px solid transparent;color:#000}
.cY{background:var(--y)}.cO{background:var(--o)}.cR{background:var(--r);color:#fff!important}
.cols button.sel{border-color:var(--tx);box-shadow:0 0 0 2px var(--bg) inset}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:7px 11px;font-size:14px;border-radius:20px}
.stat{text-align:center;padding:14px 6px;border-radius:12px;font-weight:700}
.stat span{display:block;font-size:34px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--bd);vertical-align:top}
.scroll{overflow-x:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal>div{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.hide{display:none}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--bd)}
@media print{header,nav,.noprint{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<header>
  <h1 id="ttl">Cartons Pétanque<small id="sub"></small></h1>
  <button id="bCode">☁</button>
  <button id="bStart" class="pri">▶ Commencer le concours</button>
  <button id="bEnd" class="dan">■ Terminer / Récapitulatif</button>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="modal" class="modal hide"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const KEY="cartons_petanque_v1";
const REASONS=["Cigarette / vapoteuse","Téléphone","Pied qui mord le cercle","Pied hors du cercle","Retard","Temps de jeu dépassé","Comportement antisportif","Insultes / langage","Contestation de l'arbitre","Alcool","Boules non conformes","Jeu dangereux","Autre"];
const COL={Y:["Jaune","dY","cY"],O:["Orange","dO","cO"],R:["Rouge","dR","cR"]};
let S={info:{nom:"",date:"",lieu:"",type:"",arbitre:"",notes:""},state:"prep",start:null,end:null,teams:[],cards:[]};
let tab="concours",q="";
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FIREBASE_CONFIG={apiKey:"AIzaSyAqBObvy03KeZWZxDjRVd-GmDHUmAKMQws",authDomain:"cartons-19847.firebaseapp.com",projectId:"cartons-19847",storageBucket:"cartons-19847.firebasestorage.app",messagingSenderId:"179473290623",appId:"1:179473290623:web:321ce823ae8e22d63a764a"};
const CKEY="cartons_code";let CODE="",ref=null,unsub=null,sync="local",tmr=null;
try{CODE=localStorage.getItem(CKEY)||""}catch(e){}
const fresh=()=>({info:{nom:"",date:"",lieu:"",type:"",arbitre:"",notes:""},state:"prep",start:null,end:null,teams:[],cards:[]});
function local(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("Sauvegarde impossible sur ce navigateur. Pensez à exporter la sauvegarde.")}}
function save(){S.rev=Date.now();local();push()}
function push(){if(!ref)return;clearTimeout(tmr);tmr=setTimeout(()=>ref.set({json:JSON.stringify(S)}).catch(()=>{sync="err";head()}),500)}
function connect(){
  if(unsub){unsub();unsub=null}ref=null;
  if(!CODE||typeof firebase==="undefined"){sync="local";head();return}
  try{
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    ref=firebase.firestore().collection("concours").doc(CODE);sync="wait";
    unsub=ref.onSnapshot(s=>{
      sync="ok";
      if(s.metadata.hasPendingWrites){head();return}
      if(!s.exists){push();head();return}
      let d;try{d=JSON.parse(s.data().json)}catch(e){return}
      if((d.rev||0)>(S.rev||0)){S=d;local();render()}
      else if((d.rev||0)<(S.rev||0))push();
      head();
    },()=>{sync="err";head()});
  }catch(e){sync="err";head()}
}
function askCode(){
  modal(`<h3>Code du concours</h3><p class="mu">Tous les appareils qui utilisent le même code partagent les mêmes données en temps réel. Choisissez un code long (8 caractères minimum, lettres, chiffres, - ou _) et gardez-le secret.</p><input id="cd" value="${esc(CODE)}" autocapitalize="off" autocomplete="off"><div class="row" style="margin-top:14px"><button class="pri" id="ok">Valider</button><button id="no">Plus tard (mode local)</button></div>`);
  $("no").onclick=close;
  $("ok").onclick=()=>{
    const v=$("cd").value.trim();
    if(!/^[A-Za-z0-9_-]{8,}$/.test(v))return alert("8 caractères minimum : lettres, chiffres, - ou _ uniquement.");
    if(v!==CODE){
      if(CODE){if(!confirm("Changer de code remplace les données de cet appareil par celles du nouveau code. Continuer ?"))return;S=fresh()}
      CODE=v;try{localStorage.setItem(CKEY,v)}catch(e){}
      local();connect();
    }
    close();render();
  };
}
$("bCode").onclick=askCode;
const tm=id=>S.teams.find(t=>t.id===id);
const cnt=(f)=>({Y:S.cards.filter(c=>c.col==="Y"&&f(c)).length,O:S.cards.filter(c=>c.col==="O"&&f(c)).length,R:S.cards.filter(c=>c.col==="R"&&f(c)).length});
const dots=c=>["Y","O","R"].filter(k=>c[k]).map(k=>`<span class="dot ${COL[k][1]}">${c[k]}</span>`).join("");
const fmt=t=>t?new Date(t).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
const who=c=>{const t=tm(c.team);if(!t)return"?";const p=c.p>=0?t.players[c.p]||"Joueur "+(c.p+1):"Toute l'équipe";return`#${t.num} ${t.name||""} — ${p}`};

function head(){
  $("bCode").textContent=sync==="ok"?"☁ Synchronisé":sync==="err"?"⚠ Synchro impossible":sync==="wait"?"☁ Connexion…":"☁ Définir le code";
  $("ttl").firstChild.textContent=S.info.nom||"Cartons Pétanque";
  $("sub").textContent=[S.info.date,S.info.lieu].filter(Boolean).join(" · ")+(S.state==="run"?" · EN COURS":S.state==="done"?" · TERMINÉ":"");
  $("bStart").classList.toggle("hide",S.state==="run");
  $("bStart").textContent=S.state==="done"?"↺ Rouvrir le concours":"▶ Commencer le concours";
  $("bEnd").classList.toggle("hide",S.state!=="run");
  $("nav").innerHTML=[["concours","Concours"],["equipes","Équipes ("+S.teams.length+")"],["cartons","Donner un carton"],["recap","Récapitulatif"]]
    .map(([k,l])=>`<button class="${tab===k?"on":""}" data-t="${k}">${l}</button>`).join("");
}
$("nav").onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;q="";render()}};
$("bStart").onclick=()=>{
  if(S.state==="done"){S.state="run";S.end=null}
  else{if(!S.teams.length&&!confirm("Aucune équipe enregistrée. Commencer quand même ?"))return;S.state="run";S.start=Date.now()}
  save();tab="cartons";render();
};
$("bEnd").onclick=()=>{if(confirm("Terminer le concours et afficher le récapitulatif ?")){S.state="done";S.end=Date.now();save();tab="recap";render()}};

function render(){head();const m=$("main");
  m.innerHTML=tab==="concours"?vInfo():tab==="equipes"?vTeams():tab==="cartons"?vCards():vRecap();
  bind();
}

function vInfo(){const i=S.info;const f=(k,l,t="text")=>`<div><label>${l}</label><input type="${t}" data-i="${k}" value="${esc(i[k])}"></div>`;
  return`<div class="box"><h3>Renseignements du concours</h3><div class="grid">${f("nom","Nom du concours")}${f("date","Date","date")}${f("lieu","Lieu")}${f("type","Type (triplette, mêlée…)")}${f("arbitre","Arbitre")}</div>
  <label>Notes</label><textarea data-i="notes" rows="3">${esc(i.notes)}</textarea></div>
  <div class="box"><h3>Sauvegarde</h3><p class="mu">Les données sont enregistrées automatiquement dans ce navigateur (gratuit, aucun compte). Utilisez toujours le même appareil et navigateur. Exportez régulièrement une copie de secours.</p>
  <div class="row"><button id="exp">Exporter la sauvegarde</button><button id="imp">Importer</button><span class="spacer"></span><button class="dan" id="rst">Tout effacer</button></div>
  <textarea id="bk" rows="4" class="hide" placeholder="Collez ici la sauvegarde puis cliquez sur Importer"></textarea></div>`}

function vTeams(){
  const l=S.teams.filter(t=>match(t,q));
  return`<div class="box"><h3>Ajouter des équipes</h3>
  <p class="mu">Une équipe par ligne : <i>Nom d'équipe; Joueur 1; Joueur 2; Joueur 3</i>. Le numéro est attribué automatiquement.</p>
  <textarea id="bulk" rows="4" placeholder="Les Boulistes; Paul; Marc; Luc"></textarea>
  <div class="row" style="margin-top:8px"><button class="pri" id="addB">Ajouter</button><button id="gen">Créer équipes vides 1 à 128</button></div></div>
  <div class="box"><input id="q" placeholder="Rechercher (n°, équipe, joueur)" value="${esc(q)}"><div style="margin-top:6px">${
  l.slice(0,60).map(t=>`<div class="tm" data-e="${t.id}"><div><b>#${t.num}</b> ${esc(t.name)||'<i class="mu">sans nom</i>'}<div class="mu">${t.players.map(esc).join(" · ")}</div></div><span>✎</span></div>`).join("")||'<p class="mu">Aucune équipe.</p>'}
  ${l.length>60?`<p class="mu">${l.length-60} autres… affinez la recherche.</p>`:""}</div></div>`}

const match=(t,s)=>!s||(`${t.num} ${t.name} ${t.players.join(" ")}`).toLowerCase().includes(s.toLowerCase());

function vCards(){
  if(S.state!=="run")return`<div class="box"><p>${S.state==="done"?"Le concours est terminé. Rouvrez-le pour ajouter des cartons.":"Cliquez sur « Commencer le concours » pour donner des cartons."}</p></div>`;
  const l=S.teams.filter(t=>match(t,q));
  return`<div class="box"><input id="q" placeholder="Chercher l'équipe ou le joueur (n°, nom)…" value="${esc(q)}" autofocus><div style="margin-top:6px">${
  l.slice(0,25).map(t=>`<div class="tm" data-c="${t.id}"><div><b>#${t.num}</b> ${esc(t.name)}<div class="mu">${t.players.map(esc).join(" · ")}</div></div><div>${dots(cnt(c=>c.team===t.id))}</div></div>`).join("")||'<p class="mu">Aucune équipe trouvée.</p>'}</div></div>
  <div class="box"><b>Derniers cartons</b>${list(S.cards.slice(-5).reverse())}</div>`}

function list(a,del=true){return a.length?`<div class="scroll"><table>${a.map(c=>`<tr><td><span class="dot ${COL[c.col][1]}">${COL[c.col][0][0]}</span></td><td>${esc(who(c))}<div class="mu">${esc(c.why)}${c.note?" — "+esc(c.note):""}</div></td><td class="mu">${fmt(c.t)}</td>${del&&S.state!=="done"?`<td><button data-d="${c.id}">✕</button></td>`:""}</tr>`).join("")}</table></div>`:'<p class="mu">Aucun carton.</p>'}

function vRecap(){
  const c=cnt(()=>true);const st=k=>`<div class="stat ${COL[k][2]}"><span>${c[k]}</span>${COL[k][0]}</div>`;
  const ts=S.teams.filter(t=>S.cards.some(x=>x.team===t.id));
  const rs={};S.cards.forEach(x=>rs[x.why]=(rs[x.why]||0)+1);
  return`<div class="box"><h3>${esc(S.info.nom||"Concours")}</h3><p class="mu">${[S.info.date,S.info.lieu,S.info.type,S.info.arbitre&&"Arbitre : "+S.info.arbitre].filter(Boolean).map(esc).join(" · ")}<br>Début : ${fmt(S.start)||"—"} · Fin : ${fmt(S.end)||"en cours"}</p>
  <div class="cols">${st("Y")}${st("O")}${st("R")}</div><p><b>${S.cards.length}</b> carton(s) · <b>${ts.length}</b> équipe(s) sanctionnée(s) sur ${S.teams.length}</p></div>
  <div class="box"><b>Par motif</b><p>${Object.entries(rs).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="tag">${esc(k)} : ${v}</span> `).join("")||'<span class="mu">—</span>'}</p></div>
  <div class="box"><b>Par équipe</b><div class="scroll"><table>${ts.map(t=>{const cc=cnt(x=>x.team===t.id);return`<tr><td><b>#${t.num}</b> ${esc(t.name)}</td><td>${dots(cc)}</td></tr><tr><td colspan="2" class="mu">${S.cards.filter(x=>x.team===t.id).map(x=>`${COL[x.col][0]} — ${esc(x.p>=0?t.players[x.p]||"J"+(x.p+1):"équipe")} — ${esc(x.why)}`).join("<br>")}</td></tr>`}).join("")||"<tr><td>Aucun carton.</td></tr>"}</table></div></div>
  <div class="box"><b>Chronologie</b>${list(S.cards.slice().reverse(),false)}</div>
  <div class="noprint row"><button class="pri" onclick="print()">🖨 Imprimer / PDF</button></div>`}

function bind(){
  document.querySelectorAll("[data-i]").forEach(el=>el.oninput=()=>{S.info[el.dataset.i]=el.value;save();head()});
  const qi=$("q");if(qi)qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;render();const n=$("q");n.focus();n.setSelectionRange(p,p)};
  document.querySelectorAll("[data-e]").forEach(el=>el.onclick=()=>editTeam(el.dataset.e));
  document.querySelectorAll("[data-c]").forEach(el=>el.onclick=()=>cardForm(el.dataset.c));
  document.querySelectorAll("[data-d]").forEach(el=>el.onclick=()=>{if(confirm("Supprimer ce carton ?")){S.cards=S.cards.filter(c=>c.id!==el.dataset.d);save();render()}});
  if($("addB"))$("addB").onclick=()=>{
    $("bulk").value.split("\n").map(x=>x.trim()).filter(Boolean).forEach(x=>{const p=x.split(/[;\t]/).map(s=>s.trim());S.teams.push(newTeam(p[0],p.slice(1,4)))});save();render()};
  if($("gen"))$("gen").onclick=()=>{if(S.teams.length&&!confirm("Ajouter 128 équipes en plus de celles existantes ?"))return;for(let i=0;i<128;i++)S.teams.push(newTeam("",[]));save();render()};
  if($("exp"))$("exp").onclick=()=>{$("bk").classList.remove("hide");$("bk").value=JSON.stringify(S);$("bk").select()};
  if($("imp"))$("imp").onclick=()=>{const b=$("bk");if(b.classList.contains("hide")){b.classList.remove("hide");b.value="";return}
    try{const d=JSON.parse(b.value);if(!d.teams)throw 0;if(confirm("Remplacer toutes les données actuelles ?")){S=d;save();render()}}catch(e){alert("Sauvegarde invalide.")}};
  if($("rst"))$("rst").onclick=()=>{if(confirm("Effacer TOUTES les données (équipes, cartons, infos) ?")&&confirm("Vraiment ? C'est définitif.")){S=fresh();save();tab="concours";render()}};
}
function newTeam(name,pl){const num=S.teams.reduce((m,t)=>Math.max(m,t.num),0)+1;return{id:"t"+Date.now().toString(36)+num,num,name:name||"",players:[pl[0]||"",pl[1]||"",pl[2]||""]}}

function modal(h){const m=$("modal");m.innerHTML=`<div>${h}</div>`;m.classList.remove("hide");m.onclick=e=>{if(e.target===m)close()}}
function close(){$("modal").classList.add("hide")}

function editTeam(id){const t=tm(id);
  modal(`<h3>Équipe #${t.num}</h3><label>Nom d'équipe</label><input id="en" value="${esc(t.name)}">${[0,1,2].map(i=>`<label>Joueur ${i+1}</label><input class="ep" value="${esc(t.players[i])}">`).join("")}
  <div class="row" style="margin-top:14px"><button class="pri" id="ok">Enregistrer</button><button id="no">Annuler</button><span class="spacer"></span><button class="dan" id="del">Supprimer</button></div>`);
  $("no").onclick=close;
  $("ok").onclick=()=>{t.name=$("en").value.trim();t.players=[...document.querySelectorAll(".ep")].map(x=>x.value.trim());save();close();render()};
  $("del").onclick=()=>{if(confirm("Supprimer l'équipe et ses cartons ?")){S.teams=S.teams.filter(x=>x.id!==id);S.cards=S.cards.filter(c=>c.team!==id);save();close();render()}};
}

function cardForm(id){const t=tm(id);let p=-1,col=null,why=null;
  const prev=S.cards.filter(c=>c.team===id);
  modal(`<h3>#${t.num} ${esc(t.name)}</h3>
  <label>Qui reçoit le carton ?</label><div class="chips" id="pl">${[...t.players.map((n,i)=>[i,n||"Joueur "+(i+1)]),[-1,"Toute l'équipe"]].map(([i,n])=>`<button data-p="${i}" class="${i===-1?"on":""}">${esc(n)}</button>`).join("")}</div>
  <label>Couleur</label><div class="cols" id="co">${["Y","O","R"].map(k=>`<button class="${COL[k][2]}" data-k="${k}">${COL[k][0]}</button>`).join("")}</div>
  <label>Motif</label><div class="chips" id="rs">${REASONS.map(r=>`<button data-r="${esc(r)}">${esc(r)}</button>`).join("")}</div>
  <input id="oth" class="hide" placeholder="Précisez le motif" style="margin-top:8px">
  <label>Remarque (facultatif)</label><input id="nt">
  ${prev.length?`<label>Déjà sanctionné</label>${list(prev,false)}`:""}
  <div class="row" style="margin-top:14px"><button class="pri" id="ok">Valider le carton</button><button id="no">Annuler</button></div>`);
  const sel=(box,attr,el)=>{box.querySelectorAll("button").forEach(b=>b.classList.remove(box.id==="co"?"sel":"on"));el.classList.add(box.id==="co"?"sel":"on")};
  $("pl").onclick=e=>{if(e.target.dataset.p!==undefined){p=+e.target.dataset.p;sel($("pl"),0,e.target)}};
  $("co").onclick=e=>{if(e.target.dataset.k){col=e.target.dataset.k;sel($("co"),0,e.target)}};
  $("rs").onclick=e=>{if(e.target.dataset.r){why=e.target.dataset.r;sel($("rs"),0,e.target);$("oth").classList.toggle("hide",why!=="Autre")}};
  $("no").onclick=close;
  $("ok").onclick=()=>{
    if(!col)return alert("Choisissez la couleur.");
    if(!why)return alert("Choisissez le motif.");
    let w=why;if(why==="Autre"){w=$("oth").value.trim();if(!w)return alert("Précisez le motif.")}
    S.cards.push({id:"c"+Date.now().toString(36),team:id,p,col,why:w,note:$("nt").value.trim(),t:Date.now()});
    save();close();q="";render()};
}
connect();render();
if(!CODE)askCode();
</script>
</body>
</html>
