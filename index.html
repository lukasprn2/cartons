<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartons Pétanque</title>
<style>
:root{box-sizing:border-box;--bg:#f7f6f2;--card:#fff;--tx:#20241f;--mu:#7a8179;--bd:#e8e6df;--ac:#1d6b45;--acS:#e5f0ea;--y:#f7c600;--o:#f28a00;--r:#d93a3a;--rS:#fbe9e9;--v:#3b82f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141712;--card:#1d221c;--tx:#eef1ee;--mu:#8f978f;--bd:#2b322a;--ac:#4fbf85;--acS:#1f2c24;--rS:#33201f}}
:root[data-theme="dark"]{--bg:#141712;--card:#1d221c;--tx:#eef1ee;--mu:#8f978f;--bd:#2b322a;--ac:#4fbf85;--acS:#1f2c24;--rS:#33201f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);letter-spacing:.1px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:14px 16px 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:5;border-bottom:1px solid transparent}
header h1{font-size:19px;margin:0;flex:1;min-width:0;line-height:1.25;font-weight:700}
header small{display:block;color:var(--mu);font-weight:500;font-size:12.5px;margin-top:2px}
#bCode,#bRef{font-size:12.5px;padding:7px 11px;min-height:0;border-radius:20px;background:transparent;color:var(--mu)}
#bStart,#bEnd{width:100%;order:3;padding:14px;font-size:16px;font-weight:700;border-radius:16px;letter-spacing:.2px}
main{padding:6px 16px calc(100px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;border:0;background:none;border-radius:12px;padding:7px 2px;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:0;font-weight:500}
nav button i{font-style:normal;font-size:20px;line-height:1}
nav button.on{color:var(--ac);font-weight:700;background:var(--acS)}
nav button *{pointer-events:none}
button{font:inherit;border:0;background:var(--bd);color:var(--tx);border-radius:13px;padding:11px 16px;min-height:46px;cursor:pointer;font-weight:500}
button:active{transform:scale(.98)}
button.on,button.pri{background:var(--ac);color:#fff;font-weight:700}
button.dan{color:var(--r);background:none;font-weight:600}
#bEnd{background:var(--r);color:#fff}
button:disabled{opacity:.4}
input,select,textarea{font:inherit;width:100%;padding:12px 14px;min-height:48px;border:0;border-radius:13px;background:var(--bd);color:var(--tx)}
input:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
label{display:block;font-size:12.5px;color:var(--mu);margin:16px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
h3{margin:0 0 10px;font-size:17px;font-weight:700}
.box{background:var(--card);border-radius:16px;padding:16px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr;gap:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.tm{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;cursor:pointer;min-height:56px}
.tm+.tm{border-top:1px solid var(--bg)}
.tm b{font-size:15.5px;font-weight:700}
.tm .pb{padding:8px 12px;min-height:40px;font-size:13px;white-space:nowrap;background:var(--acS);color:var(--ac);font-weight:600}
.mu{color:var(--mu);font-size:13px}
.dot{display:inline-block;min-width:24px;height:24px;line-height:24px;text-align:center;border-radius:12px;font-size:12px;font-weight:700;color:#000;margin-left:4px;padding:0 6px}
.dY{background:var(--y)}.dO{background:var(--o)}.dR{background:var(--r);color:#fff}.dV{background:var(--v);color:#fff}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cols button{height:70px;font-weight:700;font-size:13px;border:3px solid transparent;color:#000;padding:4px;border-radius:14px}
.cY{background:var(--y)}.cO{background:var(--o)}.cR{background:var(--r);color:#fff}.cV{background:var(--v);color:#fff!important}
.cols button.cR{color:#fff!important}
.cols button.sel{border-color:var(--tx)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{padding:9px 14px;font-size:14px;border-radius:20px;min-height:42px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.stat{text-align:center;padding:12px 4px;border-radius:14px;font-weight:600;color:#000;font-size:12px}
.stat.cR{color:#fff}
.stat span{display:block;font-size:28px;line-height:1.15;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 6px;border-top:1px solid var(--bd);vertical-align:top}
th{color:var(--mu);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.scroll{overflow-x:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal>div{background:var(--bg);width:100%;max-width:640px;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.modal>div>.row:last-child{position:sticky;bottom:-14px;background:var(--bg);padding:10px 0 4px;margin-top:14px!important}
.modal>div>.row:last-child button{flex:1}
.hide{display:none}
.tag{font-size:11.5px;padding:4px 10px;border-radius:20px;background:var(--bd);color:var(--mu);display:inline-block;margin:0 5px 5px 0;font-weight:600}
.rd{background:var(--rS);color:var(--r)}
.pp,.rt{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--acS);color:var(--ac);white-space:nowrap}
.rcard{border-top:1px solid var(--bd);padding:12px 0}
.rcard:first-child{border-top:0}
.rcard h4{margin:0 0 4px;font-size:15px}
@media (min-width:700px){.grid{grid-template-columns:1fr 1fr;gap:0 14px}.modal{align-items:center}.modal>div{border-radius:20px}}
@media print{header,nav,.noprint{display:none!important}body{background:#fff;color:#000}.box{border:1px solid #ccc}}
</style>
</head>
<body>
<header>
  <h1 id="ttl">Cartons Pétanque<small id="sub"></small></h1>
  <button id="bRef">👤</button>
  <button id="bCode">☁</button>
  <button id="bStart" class="pri">▶ Commencer le concours</button>
  <button id="bEnd" class="dan">■ Terminer le concours</button>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="modal" class="modal hide"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const KEY="cartons_petanque_v1";
const REASONS=["Cigarette / vapoteuse","Téléphone","Pied qui mord le cercle","Pied hors du cercle","Sort du cercle avant que la boule touche le sol","Partie du corps qui touche le sol","But mal placé après un jet infructueux de l'adversaire","Balayage devant une boule à tirer","Lance une de ses boules pendant une partie","Mesure avec les pieds","Joueur sort de la partie sans l'autorisation d'un arbitre","Temps de jeu dépassé","Comportement antisportif","Insultes / langage","Contestation de l'arbitre","Alcool","Boules non conformes","Autre"];
const COL={V:["Verbal","dV","cV"],Y:["Jaune","dY","cY"],O:["Orange","dO","cO"],R:["Rouge","dR","cR"]};
const fresh=()=>({info:{nom:"",date:"",lieu:"",format:"triple",niveau:"",arbitre:"",notes:""},state:"prep",start:null,end:null,teams:[],cards:[],dc:[],dt:[],pen:[]});
const TENUE={dept:"Tenue sportive",reg:"Haut homogène (couleur/modèle identique) + bas sportif"};
const numPlayers=()=>({tete:1,double:2,triple:3}[S.info.format]||3);
let S=fresh();
let tab="concours",q="",rq="",rsport="tous",rcat="",lastAdded=null,liveTimer=null;
const norm=()=>{S.dc=S.dc||[];S.dt=S.dt||[];S.pen=S.pen||[];S.teams.forEach(t=>{if(!t.partie)t.partie=S.partie||1});S.cards.forEach(c=>{if(c.col==="R"&&!c.sc)c.sc="C";if(!c.partie)c.partie=1})};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
norm();
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---- Aide-mémoire du règlement (hors ligne, gratuit) ---- */
const SPORTS={commun:"Commun",petanque:"Pétanque",provencal:"Jeu Provençal"};
const CATS=["Généralités","Boules & but","Jeu","Points & mesures","Discipline","Tenue & comportement","Administratif"];
const RULES=[
 {id:"formation",title:"Formation des équipes",sport:"commun",cat:"Généralités",tags:["triplette","doublette","tete a tete","joueurs","format","boules par joueur"],a:"Les deux sports opposent des triplettes (3 joueurs par équipe, 2 boules chacun), des doublettes (2 joueurs, 3 boules chacun) ou des parties en tête-à-tête (1 joueur, 3 boules chacun). Aucune autre formule n'est autorisée (Art. 1)."},
 {id:"boules_agreees",title:"Caractéristiques des boules",sport:"commun",cat:"Boules & but",tags:["boules","metal","diametre","poids","agreees"],a:"Dans les deux sports, les boules de compétition doivent être en métal, homologuées FIPJP, d'un diamètre entre 7,05 et 8 cm et d'un poids entre 650 et 800 g. Les jeunes de 11 ans et moins peuvent utiliser des boules de 600 g et 65 mm si elles sont d'un label homologué. Le label du fabricant et le poids doivent être gravés et rester lisibles (Art. 2)."},
 {id:"boules_non_conformes",title:"Sanction pour boules non conformes",sport:"commun",cat:"Boules & but",tags:["boules truquees","sanction boules","triche boules"],a:"Un joueur dont les boules sont truquées ou modifiées (plomb, sable, recuisson, etc.) est immédiatement exclu de la compétition avec son ou ses partenaires. Une boule simplement usagée ou défectueuse, sans tricherie, doit seulement être changée, à condition que la réclamation soit faite avant le début de la partie (ou entre deux mènes en cas de suspicion de triche) (Art. 2 bis)."},
 {id:"but_agree",title:"Caractéristiques du but",sport:"commun",cat:"Boules & but",tags:["but","cochonnet","diametre","poids du but"],a:"Dans les deux sports, le but doit être en bois ou en matière synthétique homologuée, d'un diamètre de 30 mm (tolérance 1 mm) et d'un poids compris entre 10 et 18 g. Il ne doit pas pouvoir être ramassé avec un aimant (Art. 3)."},
 {id:"licence",title:"Licence obligatoire",sport:"commun",cat:"Généralités",tags:["licence","ffpjp","inscription","qr code"],a:"Pour s'inscrire à une compétition, chaque joueur doit présenter sa licence (aujourd'hui un QR code). Si un joueur se présente sans son QR code mais avec une pièce d'identité, il peut participer si la compétition est gérée par l'application fédérale et que sa qualité de licencié y apparaît ; une amende de 10 € s'applique alors après vérification (Art. 4 ; Règl. administratif Art. 3)."},
 {id:"terrain_points",title:"Terrain et points (Pétanque)",sport:"petanque",cat:"Jeu",tags:["terrain","dimensions","cadre","points","13 points","treize"],a:"En Pétanque, un terrain délimité mesure au minimum 15 m sur 4 m pour les compétitions nationales, et jusqu'à 12 m sur 3 m pour les autres concours. Une partie se joue en 13 points, avec possibilité de jouer les poules ou le cadrage en 11 points (Art. 5)."},
 {id:"terrain_points_jp",title:"Terrain et points (Jeu Provençal)",sport:"provencal",cat:"Jeu",tags:["terrain","dimensions","point de mene","13 points"],a:"En Jeu Provençal, un terrain mesure 4 m de large (minimum 3,50 m) sur 24 m de long ; les 4 m sont obligatoires en carré d'honneur et aux qualificatifs des Championnats de France. Une partie se joue en 13 points (11 points possible jusqu'aux quarts de finale), avec en plus la possibilité d'instaurer un « point de mène » : un point supplémentaire à l'équipe qui marque à chaque mène, sauf s'il donnait la victoire (Art. 5)."},
 {id:"cercle",title:"Le cercle et les pieds",sport:"commun",cat:"Jeu",tags:["cercle","pied","pieds","mordre","sortir du cercle"],a:"Dans les deux sports, le cercle de lancement mesure entre 35 et 50 cm de diamètre, tracé ou posé à plus d'1 m de tout obstacle et à au moins 1,50 m d'un autre cercle ou but utilisé. Les pieds doivent rester entièrement à l'intérieur, sans mordre sur le cercle, jusqu'à ce que la boule lancée ait touché le sol ; aucune autre partie du corps ne doit toucher le sol à l'extérieur (Art. 6)."},
 {id:"cercle_jp_forme",title:"Cercle matérialisé (Jeu Provençal)",sport:"provencal",cat:"Jeu",tags:["cercle materialise","ouverture cercle","rigide"],a:"En Jeu Provençal, un cercle matérialisé doit être rigide, avoir un diamètre de 50 cm et posséder une ouverture à l'arrière dont la corde mesure 35 cm — une forme spécifique que la Pétanque n'impose pas (Art. 6)."},
 {id:"essai_but_petanque",title:"Nombre d'essais pour lancer le but (Pétanque)",sport:"petanque",cat:"Jeu",tags:["essai","lancer but","un essai"],a:"En Pétanque, l'équipe qui gagne le droit de lancer le but n'a droit qu'à UN seul essai. S'il est infructueux, le but est remis à l'équipe adverse qui doit le placer dans une position réglementaire (Art. 7)."},
 {id:"essai_but_jp",title:"Nombre d'essais pour lancer le but (Jeu Provençal)",sport:"provencal",cat:"Jeu",tags:["essai","lancer but","deux essais"],a:"En Jeu Provençal, l'équipe qui gagne le droit de lancer le but a droit à DEUX essais. Si les deux sont infructueux, le but est remis à l'équipe adverse (Art. 6)."},
 {id:"lancer_but_distance",title:"Distance de lancer du but (Pétanque)",sport:"petanque",cat:"Jeu",tags:["but","distance","lancer","6 metres","10 metres"],a:"En Pétanque, pour les juniors et seniors, le but doit être lancé entre 6 et 10 m du bord intérieur du cercle, à au moins 50 cm de tout obstacle et de la ligne de fond, à 1,50 m d'un autre but ou cercle utilisé, et visible du joueur placé dans le cercle (Art. 7)."},
 {id:"lancer_but_distance_jp",title:"Distance de lancer du but (Jeu Provençal)",sport:"provencal",cat:"Jeu",tags:["but","distance","lancer","15 metres","20 metres","12 metres","17 metres"],a:"En Jeu Provençal, les distances de lancer du but sont bien plus longues qu'en Pétanque : 12 à 15 m pour les Minimes, 13 à 17 m pour les Cadets, et 15 à 20 m pour les Juniors et Seniors, mesurées depuis le bord intérieur du cercle (Art. 7)."},
 {id:"but_nul",title:"Quand le but est-il nul ? (Pétanque)",sport:"petanque",cat:"Jeu",tags:["but nul","annulation but"],a:"En Pétanque, le but est nul notamment s'il est déplacé en terrain interdit, s'il n'est plus visible du cercle, s'il se retrouve à plus de 20 m ou à moins de 3 m du cercle, s'il est introuvable après 5 minutes de recherche, ou si un terrain interdit se trouve entre le but et le cercle (Art. 9)."},
 {id:"but_nul_jp",title:"Quand le but est-il nul ? (Jeu Provençal)",sport:"provencal",cat:"Jeu",tags:["but nul","annulation but"],a:"En Jeu Provençal, le but est nul notamment s'il est déplacé en terrain interdit, s'il n'est plus visible du cercle, s'il se retrouve à moins de 6 m du cercle de lancement, s'il traverse plusieurs jeux contigus, ou s'il est introuvable après 5 minutes de recherche (Art. 9)."},
 {id:"technique_provencal_but",title:"Le pas pour lancer le but (Jeu Provençal)",sport:"provencal",cat:"Jeu",tags:["pas obligatoire","lancer but","technique"],a:"Particularité du Jeu Provençal : pour lancer le but, le joueur doit avoir au départ les deux pieds entièrement dans le cercle et faire obligatoirement un pas. La Pétanque n'impose aucun pas : le lancer se fait pieds fixes dans le cercle (Art. 6)."},
 {id:"technique_provencal_pointer",title:"Le pas pour pointer (Jeu Provençal)",sport:"provencal",cat:"Jeu",tags:["pointer","pas","technique de jeu"],a:"Pour pointer en Jeu Provençal, le joueur part avec les deux pieds dans le cercle puis fait obligatoirement un pas, sans sortir le pied resté dans le cercle ni sauter. Il peut ensuite se tenir sur une jambe (le pied levé ne peut retoucher le sol qu'après que la boule ait quitté la main) ou garder les deux pieds au sol sans déplacer celui resté dans le cercle. Les joueurs en fauteuil doivent garder une grande roue dans le cercle ; les unijambistes peuvent s'aider de leurs béquilles pour le pas (Art. 6)."},
 {id:"technique_provencal_tirer",title:"Le pas pour tirer (Jeu Provençal)",sport:"provencal",cat:"Jeu",tags:["tirer","trois pas","technique de jeu"],a:"Pour tirer en Jeu Provençal, il faut obligatoirement faire trois pas, avec au moins un pied entièrement dans le cercle au départ, sans dépasser le bord du cercle le plus proche du but. La boule doit être lâchée au moment du troisième appui, et au plus tard avant le quatrième (Art. 6)."},
 {id:"obstacles",title:"Déplacer un obstacle ou une donnée",sport:"commun",cat:"Jeu",tags:["donnee","obstacle","tater","balayage"],a:"Il est interdit de supprimer, déplacer ou écraser un obstacle du terrain. Le joueur qui s'apprête à lancer le but peut tâter une donnée avec une boule, sans frapper plus de trois fois le sol. Un balayage devant une boule à tirer est sanctionnable (Art. 10)."},
 {id:"changement_but_boule",title:"Changer de but ou de boule",sport:"commun",cat:"Jeu",tags:["changer boule","boule cassee","but introuvable"],a:"Changer de but ou de boule en cours de partie n'est autorisé que si l'objet est introuvable (recherche limitée à 5 minutes) ou s'il se casse ; en cas de casse, le plus gros morceau compte jusqu'au remplacement (Art. 11)."},
 {id:"boule_nulle_terrain",title:"Boule en terrain interdit",sport:"commun",cat:"Jeu",tags:["boule nulle","terrain interdit"],a:"Toute boule est nulle dès qu'elle passe entièrement en terrain interdit ; une boule à cheval sur la limite reste bonne. Une boule nulle doit être retirée immédiatement, sinon elle est considérée comme bonne dès que l'adversaire a joué (Art. 19)."},
 {id:"boule_arretee_volontairement",title:"Arrêter une boule volontairement",sport:"commun",cat:"Jeu",tags:["arreter boule","disqualification immediate"],a:"Un joueur qui arrête volontairement une boule en mouvement est immédiatement disqualifié pour la partie en cours, ainsi que son équipe (Art. 20)."},
 {id:"temps_jeu",title:"Temps pour jouer sa boule",sport:"commun",cat:"Jeu",tags:["temps","minute","chronometre","jouer"],a:"Un joueur dispose d'une minute maximum pour lancer sa boule, délai qui court dès l'arrêt du but ou de la boule précédente, ou après une mesure. La même minute s'applique au lancer du but (Art. 21)."},
 {id:"mauvaise_boule",title:"Jouer la boule d'un autre joueur",sport:"commun",cat:"Jeu",tags:["mauvaise boule","boule d'un autre"],a:"Jouer la boule d'un autre joueur entraîne un avertissement ; la boule doit être immédiatement remplacée. En cas de récidive dans la même partie, la boule jouée est annulée et tout ce qu'elle a déplacé est remis en place (Art. 23)."},
 {id:"mesure",title:"Qui mesure les points ?",sport:"commun",cat:"Points & mesures",tags:["mesure","mesurer","litige","points","decametre"],a:"La mesure d'un point se fait avec un instrument approprié, jamais avec les pieds. Les joueurs doivent rester à au moins 2 m de l'arbitre pendant qu'il mesure, et sa décision est alors sans appel (Art. 26)."},
 {id:"reclamation",title:"Faire une réclamation",sport:"commun",cat:"Points & mesures",tags:["reclamation","contestation formelle"],a:"Toute réclamation doit être adressée à un arbitre. Une fois la partie terminée, aucune réclamation n'est plus recevable (Art. 31)."},
 {id:"retard",title:"Retard ou absence d'une équipe",sport:"commun",cat:"Discipline",tags:["retard","en retard","penalite","absence","30 minutes"],a:"Un quart d'heure après l'annonce des résultats du tirage au sort, l'équipe absente est pénalisée d'un point, puis d'un point supplémentaire par tranche de 5 minutes de retard. Une équipe toujours absente 30 minutes après le début ou la reprise des parties est éliminée de la compétition (Art. 32)."},
 {id:"retardataire",title:"Joueur retardataire",sport:"commun",cat:"Discipline",tags:["retardataire","mene","participer"],a:"Un joueur arrivant après le début d'une mène n'y participe pas ; il est admis à partir de la mène suivante. Passé 30 minutes après le début de la partie, il perd le droit d'y participer, mais peut rejoindre son équipe à la partie suivante si elle est qualifiée et nominativement inscrite (Art. 33)."},
 {id:"sortie_terrain",title:"Quitter le terrain",sport:"commun",cat:"Discipline",tags:["sortie","quitter","absence joueur"],a:"Un joueur ne peut quitter le terrain sans l'autorisation d'un arbitre. Son absence n'interrompt pas la partie : ses partenaires doivent continuer à jouer dans la minute impartie, et s'il n'est pas revenu pour jouer ses boules, celles-ci sont annulées à raison d'une par minute (Art. 32)."},
 {id:"remplacement",title:"Remplacer un joueur",sport:"commun",cat:"Discipline",tags:["remplacement","changement de joueur"],a:"Remplacer un joueur en doublette, ou un ou deux joueurs en triplette, n'est autorisé qu'avant l'annonce officielle du début de la compétition, et seulement si le remplaçant n'est pas déjà inscrit avec une autre équipe (Art. 34)."},
 {id:"echelle",title:"Les sanctions de l'article 35",sport:"commun",cat:"Discipline",tags:["carton","sanction","ordre","echelle","gradation"],a:"L'article 35 prévoit, par ordre : l'avertissement (carton jaune), l'annulation de la boule jouée ou à jouer (carton orange), l'exclusion du joueur pour la partie (carton rouge), la disqualification de l'équipe fautive, et la disqualification des deux équipes en cas de connivence. Un avertissement ne peut être donné qu'après constatation d'une infraction, jamais à titre préventif."},
 {id:"verbal",title:"Avertissement verbal",sport:"commun",cat:"Discipline",tags:["verbal","avertissement","rappel"],a:"Le règlement appelle « avertissement » ce que matérialise le carton jaune : il ne peut être donné qu'après une infraction constatée. Un simple rappel oral avant ce carton est une pratique courante de certains arbitres, mais ce n'est pas une sanction définie en tant que telle par le règlement."},
 {id:"jaune",title:"Carton jaune",sport:"commun",cat:"Discipline",tags:["jaune","carton jaune"],a:"Le carton jaune marque un avertissement officiel. S'il sanctionne un dépassement de temps, il est donné à toute l'équipe ; si un joueur a déjà un carton jaune, il perd une boule pour la mène en cours ou la suivante (Art. 35)."},

 {id:"rouge",title:"Carton rouge",sport:"commun",cat:"Discipline",tags:["rouge","carton rouge","exclusion","disqualification"],a:"Le carton rouge exclut le joueur fautif de la partie en cours. Selon la gravité, l'équipe entière peut aussi être disqualifiée, voire les deux équipes en cas de connivence (Art. 35)."},
 {id:"intemperies",title:"Intempéries",sport:"commun",cat:"Discipline",tags:["pluie","intemperies","arret partie"],a:"En cas de fortes intempéries, toute mène déjà commencée doit être terminée, sauf décision contraire de l'arbitre, seul habilité à arrêter les parties après consultation du jury ou du comité d'organisation (Art. 36)."},
 {id:"contestation",title:"Contester une décision d'arbitre",sport:"commun",cat:"Discipline",tags:["contestation","contester","discussion arbitre"],a:"Les décisions d'un arbitre sur le terrain ne peuvent être contestées auprès du jury que si elles concernent l'interprétation du règlement, et seulement si la partie n'a pas repris depuis. Un comportement irrespectueux envers l'arbitre est lui-même une faute sanctionnable (Règl. administratif, Art. 27)."},
 {id:"jury_role",title:"Rôle du jury de concours",sport:"commun",cat:"Administratif",tags:["jury","pouvoirs jury","decisions jury"],a:"Le jury de concours (3 à 4 membres) veille au bon déroulement matériel et sportif de la compétition et peut sanctionner un comportement en dehors d'une partie (avertissement, exclusion définitive). Il n'intervient pas sur une décision arbitrale prise pendant une partie ; ses décisions sont sans appel (Règl. administratif, Art. 7)."},
 {id:"droit_retrait",title:"Droit de retrait de l'arbitre",sport:"commun",cat:"Administratif",tags:["droit de retrait","agression","menace arbitre"],a:"Un arbitre victime d'une agression physique ou de menaces graves peut faire valoir son droit de retrait auprès du jury, qui doit alors prononcer l'arrêt définitif du concours et transmettre un rapport détaillé à l'organe compétent (Règl. administratif, Art. 28)."},
 {id:"tenue",title:"Tenue vestimentaire obligatoire",sport:"commun",cat:"Tenue & comportement",tags:["tenue","vetement","habits","maillot","chaussures"],a:"Une tenue correcte est obligatoire : chaussures entièrement fermées, pas de torse nu, pas de débardeur, legging, robe, jupe, jean ni pantalon de ville — le bas doit être sportif (short ou survêtement). Pour les compétitions qui l'exigent, le haut de toute l'équipe doit être homogène en couleur et en conception. L'arbitre statue sur la conformité des chaussures ; pour le reste de la tenue, la disqualification relève du jury (Règl. administratif, Art. 22 et Annexe VII)."},
 {id:"cigarette_telephone",title:"Cigarette et téléphone",sport:"commun",cat:"Tenue & comportement",tags:["cigarette","vapoteuse","telephone","fumer","portable"],a:"Fumer sur les terrains, y compris la cigarette électronique, est interdit, de même que l'usage du téléphone portable pendant les parties. Un joueur qui persiste après avertissement d'un arbitre peut être exclu de la compétition (Art. 39)."},
 {id:"alcool",title:"Contrôle d'alcoolémie",sport:"commun",cat:"Tenue & comportement",tags:["alcool","ivresse","controle alcool"],a:"Un contrôle est considéré positif à partir de 0,25 mg par litre d'air expiré (environ 0,50 g/l de sang), et 0,00 pour les officiels et éducateurs. En cas de premier contrôle positif, un second contrôle a lieu 20 à 30 minutes après ; une nouvelle positivité entraîne l'exclusion définitive de la compétition (Règl. administratif, Art. 40)."},
 {id:"probleme_medical",title:"Problème médical en cours de partie",sport:"commun",cat:"Tenue & comportement",tags:["blessure","medical","soins","malaise"],a:"En cas de problème médical en cours de partie, celle-ci est arrêtée au maximum 15 minutes pour les soins. Si le joueur ne peut reprendre à l'issue de ce délai, il est écarté du reste de la compétition sauf avis médical contraire ; ses partenaires peuvent continuer sans ses boules, ou abandonner (Règl. administratif, Art. 23)."},
 {id:"coaching",title:"Coaching pendant la partie",sport:"commun",cat:"Tenue & comportement",tags:["coaching","coach","conseiller","accompagnateur"],a:"Un éducateur diplômé habilité comme coach peut intervenir verbalement auprès de son équipe pendant la minute de jeu autorisée, depuis sa chaise. Ce rôle est réservé aux titulaires d'un brevet fédéral désignés à cet effet, pas à n'importe quel accompagnateur (Règl. administratif, Art. 32 et 36)."}

const stripA=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s]/g," ");
const toks=s=>stripA(s).split(/\s+/).filter(w=>w.length>1&&!STOP.has(w));
RULES.forEach(r=>{r._idx=stripA(r.title+" "+r.tags.join(" ")+" "+r.a);r._ti=stripA(r.title)});

function searchRules(query){
  const pool=scoped();
  const qt=toks(query);if(!qt.length)return pool;
  return pool.map(r=>{let s=0;qt.forEach(t=>{if(r._ti.includes(t))s+=3;else if(r._idx.includes(t))s+=1;if(r.tags.some(g=>stripA(g).includes(t)))s+=2});return{r,s}})
    .filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,8).map(x=>x.r);
}

/* Fusion : plusieurs arbitres peuvent travailler en même temps sans s'écraser */
function merge(a,b){
  const n=(a.rev||0)>=(b.rev||0)?a:b;
  const dc=[...new Set([...(a.dc||[]),...(b.dc||[])])],dt=[...new Set([...(a.dt||[]),...(b.dt||[])])];
  const T={};[...(b.teams||[]),...(a.teams||[])].forEach(t=>{if(dt.includes(t.id))return;const o=T[t.id];if(!o||(t.r||0)>=(o.r||0))T[t.id]=t});
  const C={};[...(b.cards||[]),...(a.cards||[])].forEach(c=>{if(!dc.includes(c.id)&&!dt.includes(c.team))C[c.id]=c});
  const P={};[...(b.pen||[]),...(a.pen||[])].forEach(x=>{if(!dc.includes(x.id)&&!dt.includes(x.team))P[x.id]=x});
  return{info:n.info,state:n.state,start:n.start,end:n.end,partie:n.partie,pen:Object.values(P).sort((x,y)=>x.t-y.t||(x.id<y.id?-1:1)),
    teams:Object.values(T).sort((x,y)=>x.num-y.num||(x.id<y.id?-1:1)),
    cards:Object.values(C).sort((x,y)=>x.t-y.t||(x.id<y.id?-1:1)),
    dc,dt,rev:Math.max(a.rev||0,b.rev||0)};
}
function connect(){
  if(unsub){unsub();unsub=null}ref=null;
  if(!CODE||typeof firebase==="undefined"){sync="local";head();return}
  try{
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    ref=firebase.firestore().collection("concours").doc(CODE);sync="wait";
    unsub=ref.onSnapshot(s=>{
      sync="ok";
      if(s.metadata.hasPendingWrites){head();return}
      if(!s.exists){push();head();return}
      let d;try{d=JSON.parse(s.data().json)}catch(e){return}
      const m=merge(S,d),changed=JSON.stringify(m)!==JSON.stringify(merge(S,S));
      if(changed){S=m;norm();local();render()}
      if(JSON.stringify(m)!==JSON.stringify(merge(d,d)))push();
      head();
    },()=>{sync="err";head()});
  }catch(e){sync="err";head()}
}

function vSuivi(){
  const l=S.teams.filter(t=>match(t,q));
  const byPartie={};l.forEach(t=>byPartie[t.partie]=(byPartie[t.partie]||0)+1);
  const parties=Object.keys(byPartie).map(Number).sort((a,b)=>a-b);
  const lastAction=t=>{const cs=S.cards.filter(c=>c.team===t.id).map(c=>c.t),ps=S.pen.filter(p=>p.team===t.id).map(p=>p.t);const all=[...cs,...ps];return all.length?Math.max(...all):0};
  const lastPen=t=>{const ps=S.pen.filter(p=>p.team===t.id&&p.partie===t.partie);return ps.length?Math.max(...ps.map(p=>p.t)):0};
  const sorted=l.slice().sort((a,b)=>b.partie-a.partie||lastAction(b)-lastAction(a));
  const recentRet=t=>{const lp=lastPen(t);return lp&&(Date.now()-lp)<20*60000};
  return`<div class="box"><h3>Vue d'ensemble</h3><p class="mu">Où en est chaque équipe, tous arbitres confondus. Se met à jour automatiquement.</p>
  <div class="stats">${parties.map(p=>`<div class="stat" style="background:var(--bd);color:var(--tx)"><span>${byPartie[p]}</span>Partie ${p}</div>`).join("")}</div></div>
  <div class="box"><input id="q" placeholder="Chercher (n°, joueur)" value="${esc(q)}"></div>
  <div class="box"><div class="scroll"><table><tr><th>Équipe</th><th>Partie</th><th>Statut</th><th>Dernière action</th></tr>${sorted.slice(0,80).map(t=>{
    const la=lastAction(t);
    return`<tr><td><b>#${t.num}</b></td><td><span class="pp">P${t.partie}</span></td><td>${badge(t)||recentRet(t)?`${badge(t)}${recentRet(t)?'<span class="rt">⏱ retard récent</span>':""}`:'<span class="mu">—</span>'}</td><td class="mu">${la?ago(la):"aucune"}</td></tr>`}).join("")||'<tr><td colspan="4" class="mu">Aucune équipe.</td></tr>'}</table></div>
  ${sorted.length>80?`<p class="mu">${sorted.length-80} autres… affinez la recherche.</p>`:""}</div>`}

  <label>Sport</label><div class="chips">${Object.entries({tous:"Tous",petanque:"🔵 Pétanque",provencal:"🟠 Jeu Provençal"}).map(([k,l])=>`<button data-rs="${k}" class="${rsport===k?"on":""}">${l}</button>`).join("")}</div>

  <div class="box"><p class="mu" style="margin:0 0 10px">${nRes(res.length)}${rsport!=="tous"?" · "+SPORTS[rsport]:""}${rcat?" · "+esc(rcat):""}</p>${
    res.length?res.map(r=>`<div class="rcard"><h4>${esc(r.title)} ${r.sport!=="commun"?`<span class="tag" style="background:${r.sport==="petanque"?"#3b82f622":"#f28a0022"}">${SPORTS[r.sport]}</span>`:""}</h4><p style="margin:0">${esc(r.a)}</p></div>`).join("")
    :'<p class="mu">Aucune fiche pour ces filtres. Essayez un autre mot-clé ou élargissez le sport/la catégorie.</p>'

function list(a,del=true){return a.length?`<div class="scroll"><table>${a.map(c=>`<tr><td><span class="dot ${COL[c.col][1]}">${dl(c)}</span></td><td>${esc(who(c))}<div class="mu">${esc(c.why)}${c.note?" — "+esc(c.note):""} · ${lab(c)}${c.by?" · Arbitre : "+esc(c.by):""}</div></td><td class="mu">${fmt(c.t)}</td>${del&&S.state!=="done"?`<td><button data-d="${c.id}">✕</button></td>`:""}</tr>`).join("")}</table></div>`:'<p class="mu">Aucun carton.</p>'}

function vRecap(){

  <p class="mu" style="margin:10px 0 4px">D'une partie</p><p style="margin:0">${dP.length?dP.map(x=>{const t=tm(x.team);return`<span class="tag rd">#${t.num} (partie ${x.partie||1})</span>`}).join(" "):'<span class="mu">Aucune</span>'}</p></div>

  <div class="box"><b>Par partie</b><div class="scroll"><table><tr><th>Partie</th><th>🗣 Verbal</th><th>🟨</th><th>🟧</th><th>🟥 Partie</th><th>🟥 Concours</th></tr>${parties.map(pn=>{const cc=cnt(x=>(x.partie||1)===pn),k=S.cards.filter(x=>(x.partie||1)===pn&&isC(x)).length;return`<tr><td>${pn}</td><td>${cc.V}</td><td>${cc.Y}</td><td>${cc.O}</td><td>${cc.R-k}</td><td>${k}</td></tr>`}).join("")||'<tr><td colspan="6" class="mu">Aucun carton.</td></tr>'}</table></div></div>

  <div class="box"><b>Par équipe</b><div class="scroll"><table>${ts.map(t=>{const cc=cnt(x=>x.team===t.id);return`<tr><td><b>#${t.num}</b> <span class="mu">(partie ${t.partie})</span>${disqC(t.id)?' 🚫':""}</td><td>${dots(cc)}</td></tr><tr><td colspan="2" class="mu">${S.cards.filter(x=>x.team===t.id).map(x=>`${COL[x.col][0]} — ${esc(x.p>=0?pl(t,x.p):"équipe")} — ${esc(x.why)} — ${lab(x)}`).join("<br>")}</td></tr>`}).join("")||"<tr><td>Aucun carton.</td></tr>"}</table></div></div>
  <div class="box"><b>Chronologie</b>${list(S.cards.slice().reverse(),false)}</div>
  <div class="noprint row"><button class="pri" onclick="print()">🖨 Imprimer / PDF</button></div>`}

function replaceAll(d){
  const ids=new Set(d.teams.map(t=>t.id)),cs=new Set([...(d.cards||[]),...(d.pen||[])].map(c=>c.id));
  const dt=S.teams.filter(t=>!ids.has(t.id)).map(t=>t.id),dc=[...S.cards,...S.pen].filter(c=>!cs.has(c.id)).map(c=>c.id);
  S=Object.assign(fresh(),d);S.dt=[...(S.dt||[]),...dt];S.dc=[...(S.dc||[]),...dc];norm();
}
function undo(){
  if(!lastValid())return;
  if(!confirm(`Annuler : ${lastAdded.desc} ?`))return;
  if(lastAdded.kind==="card"){S.dc.push(lastAdded.id);S.cards=S.cards.filter(c=>c.id!==lastAdded.id)}
  else{S.dc.push(lastAdded.id);S.pen=S.pen.filter(p=>p.id!==lastAdded.id)}
  lastAdded=null;save();render();
}
function bind(){
  document.querySelectorAll("[data-i]").forEach(el=>el.oninput=()=>{S.info[el.dataset.i]=el.value;save();head()});
  const qi=$("q");if(qi)qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;render();const n=$("q");n.focus();n.setSelectionRange(p,p)};
  const rqi=$("rq");if(rqi)rqi.oninput=()=>{rq=rqi.value;const p=rqi.selectionStart;render();const n=$("rq");n.focus();n.setSelectionRange(p,p)};
  document.querySelectorAll("[data-sg]").forEach(el=>el.onclick=()=>{rq=el.dataset.sg;render()});
  document.querySelectorAll("[data-rs]").forEach(el=>el.onclick=()=>{rsport=el.dataset.rs;render()});
  document.querySelectorAll("[data-rc]").forEach(el=>el.onclick=()=>{rcat=el.dataset.rc;render()});
  document.querySelectorAll("[data-e]").forEach(el=>el.onclick=e=>{if(e.target.closest("[data-qd]"))return;editTeam(el.dataset.e)});
  document.querySelectorAll("[data-qd]").forEach(el=>el.onclick=e=>{e.stopPropagation();quickDelete(el.dataset.qd)});
  document.querySelectorAll("[data-c]").forEach(el=>el.onclick=e=>{if(e.target.closest("[data-np]"))return;cardForm(el.dataset.c)});
  document.querySelectorAll("[data-np]").forEach(el=>el.onclick=()=>{const t=tm(el.dataset.np);if(!t)return;
    if(confirm(`Équipe #${t.num} : passer à la partie ${t.partie+1} ?\n\nSes avertissements et cartons de la partie ${t.partie} seront remis à zéro (l'historique est conservé dans le récap). Un carton rouge « concours » reste actif.`)){t.partie++;t.r=Date.now();save();render()}});
  document.querySelectorAll("[data-dp]").forEach(el=>el.onclick=()=>{if(confirm("Supprimer ce retard ?")){S.dc.push(el.dataset.dp);S.pen=S.pen.filter(p=>p.id!==el.dataset.dp);if(lastAdded&&lastAdded.id===el.dataset.dp)lastAdded=null;save();render()}});
  document.querySelectorAll("[data-d]").forEach(el=>el.onclick=()=>{if(confirm("Supprimer ce carton ?")){S.dc.push(el.dataset.d);S.cards=S.cards.filter(c=>c.id!==el.dataset.d);if(lastAdded&&lastAdded.id===el.dataset.d)lastAdded=null;save();render()}});
  if($("undoBtn"))$("undoBtn").onclick=undo;
  if($("editRef"))$("editRef").onclick=askRef;
  if($("delElim"))$("delElim").onclick=deleteEliminated;
  if($("addB"))$("addB").onclick=()=>{
    $("bulk").value.split("\n").map(x=>x.trim()).filter(Boolean).forEach(x=>{const p=x.split(/[;\t]/).map(s=>s.trim());S.teams.push(newTeam(p))});save();render()};
  if($("gen"))$("gen").onclick=()=>{
    const n=parseInt($("nbEq")?.value)||0;
    if(!n||n<1)return alert("Indiquez d'abord le nombre d'équipes à créer.");
    if(S.teams.length&&!confirm(`Ajouter ${n} équipe(s) vide(s) en plus de celles existantes ?`))return;
    for(let i=0;i<n;i++)S.teams.push(newTeam([]));save();render();
  };
  if($("exp"))$("exp").onclick=()=>{$("bk").classList.remove("hide");$("bk").value=JSON.stringify(S);$("bk").select()};
  if($("imp"))$("imp").onclick=()=>{const b=$("bk");if(b.classList.contains("hide")){b.classList.remove("hide");b.value="";return}
    try{const d=JSON.parse(b.value);if(!d.teams)throw 0;if(confirm("Remplacer toutes les données actuelles ?")){replaceAll(d);save();render()}}catch(e){alert("Sauvegarde invalide.")}};
  if($("rst"))$("rst").onclick=()=>{if(confirm("Effacer TOUTES les données (équipes, cartons, infos) ?")&&confirm("Vraiment ? C'est définitif.")){replaceAll(fresh());lastAdded=null;save();tab="concours";render()}};
}
function newTeam(p){const num=S.teams.reduce((m,t)=>Math.max(m,t.num),0)+1;const n=numPlayers();const players=[];for(let k=0;k<n;k++)players.push(p[k]||"");return{id:uid("t")+num,num,players,partie:1,r:Date.now()}}

function quickDelete(id){
  const t=tm(id);if(!t)return;
  if(confirm(`Supprimer l'équipe #${t.num} et ses cartons ?`)){
    S.dt.push(id);S.teams=S.teams.filter(x=>x.id!==id);S.cards=S.cards.filter(c=>c.team!==id);S.pen=S.pen.filter(p=>p.team!==id);save();render();
  }
}
function deleteEliminated(){
  const elim=S.teams.filter(t=>disqC(t.id)||disqP(t));
  if(!elim.length)return alert("Aucune équipe éliminée pour le moment.");
  if(!confirm(`Supprimer ${elim.length} équipe(s) éliminée(s) et tous leurs cartons/retards ?\n\n${elim.map(t=>`#${t.num}`).join(", ")}`))return;
  const ids=new Set(elim.map(t=>t.id));
  ids.forEach(id=>S.dt.push(id));
  S.teams=S.teams.filter(t=>!ids.has(t.id));
  S.cards=S.cards.filter(c=>!ids.has(c.team));
  S.pen=S.pen.filter(p=>!ids.has(p.team));
  save();render();
}

function modal(h){const m=$("modal");m.innerHTML=`<div>${h}</div>`;m.classList.remove("hide");m.onclick=e=>{if(e.target===m)close()}}
function close(){$("modal").classList.add("hide")}

  $("ok").onclick=()=>{const t=tm(id);if(t){t.players=[...document.querySelectorAll(".ep")].map(x=>x.value.trim());t.partie=Math.max(1,parseInt($("epa").value)||1);t.r=Date.now();save()}close();render()};
  $("del").onclick=()=>{if(confirm("Supprimer l'équipe et ses cartons ?")){S.dt.push(id);S.teams=S.teams.filter(x=>x.id!==id);S.cards=S.cards.filter(c=>c.team!==id);S.pen=S.pen.filter(p=>p.team!==id);save();close();render()}};

  $("rs").onclick=e=>{if(e.target.dataset.r){why=e.target.dataset.r;sel($("rs"),e.target);$("oth").classList.toggle("hide",why!=="Autre")}};
  $("no").onclick=close;

}
function lateForm(id){const t=tm(id);let k=null;
  const T=[["15–20 min","1 point pour l'adversaire",1,0],["20–25 min","2 points pour l'adversaire",2,0],["25–30 min","3 points pour l'adversaire",3,0],["+ de 30 min","Disqualification de la partie",0,1]];

  <div class="row" style="margin-top:14px"><button class="pri" id="ok">Valider le retard</button><button id="no">Annuler</button></div>`);
  $("lt").onclick=e=>{const b=e.target.closest("button");if(b){k=+b.dataset.l;$("lt").querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on")}};
  $("no").onclick=close;
  $("ok").onclick=()=>{if(k===null)return alert("Choisissez la durée du retard.");

    const pid=uid("p");
    S.pen.push({id:pid,team:id,opp:$("op").value||"",partie:t2.partie,lbl:T[k][0],pts:T[k][2],disq:!!T[k][3],t:Date.now(),by:REF||""});
